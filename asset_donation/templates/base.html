<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Admin Panel{% endblock %}
    </title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'admin_panel/css/admin.css' %}">
</head>

<body>

    <div class="admin-layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                Asset Donation
            </div>

            <nav>

                <a href="{% url 'admin_dashboard' %}">
                    Dashboard
                </a>

                <a href="{% url 'admin_users' %}">
                    Users
                </a>

                <a href="{% url 'admin_donations' %}">
                    Donations
                </a>

                <a href="{% url 'admin_categories' %}">
                    Categories
                </a>

                <a href="{% url 'admin_requests' %}">
                    Requests
                </a>

                <a href="{% url 'admin_verification' %}">
                    Verification
                </a>

                <a href="{% url 'admin_reports' %}">
                    Reports
                </a>

                <a href="{% url 'admin_subscriptions' %}">
                    Subscriptions
                </a>

            </nav>

            <div class="sidebar-bottom">

                <a href="{% url 'admin_logout' %}">
                    Logout
                </a>

            </div>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <header class="topbar">

                <h2>
                    {% block page_title %}
                    Dashboard
                    {% endblock %}
                </h2>

                <div class="admin-user">
                    {{ request.user.username }}
                </div>

            </header>


            <section class="content">

                {% block content %}
                {% endblock %}

            </section>

        </main>

    </div>

    <script src="{% static 'admin_panel/js/admin.js' %}"></script>

</body>

</html>
