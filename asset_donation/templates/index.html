{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTHHAND - Asset Donation</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
        }

        .container {
            text-align: center;
            padding: 50px 30px;
            max-width: 700px;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: normal;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #dbeafe;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: white;
            color: #1e3a8a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #dbeafe;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 40px;
            font-size: 14px;
            color: #bfdbfe;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>NTHHAND</h1>

        <h2>Asset Donation Platform</h2>

        <p>
            Welcome to NTHHAND.
            A platform for managing and supporting asset donations
            efficiently and securely.
        </p>

        <a href="/" class="btn">Get Started</a>

        <footer>
            © 2026 NTHHAND. All Rights Reserved.
        </footer>
    </div>

</body>
</html>
