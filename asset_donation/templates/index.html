    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
        }

        .container {
            text-align: center;
            padding: 50px 30px;
            max-width: 700px;
        }

        .logo-wrapper {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 90px;
            height: 90px;
            margin-bottom: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
            padding: 16px;
        }

        .logo-wrapper svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 20px;
            font-weight: normal;
            color: #93c5fd;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #dbeafe;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: white;
            color: #1e3a8a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background: #dbeafe;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        footer {
            margin-top: 40px;
            font-size: 14px;
            color: #bfdbfe;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Direct Inline SVG Logo: guaranteed to display on any server -->
        <div class="logo-wrapper">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Open palm shape -->
                <rect x="18" y="28" width="28" height="20" rx="5" fill="white"/>

                <rect x="18" y="16" width="6" height="16" rx="3" fill="white"/>

        <footer>
            © 2026 NTHHAND. All Rights Reserved.
        </footer>
